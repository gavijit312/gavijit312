name: Generate Pacman Contribution Graph

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate pacman graph
        uses: maurodesouza/pacman-contribution-graph@main

      - name: Commit & push
        uses: EndBug/add-and-commit@v9
        with:
          message: "Generate Pacman contribution graph"
